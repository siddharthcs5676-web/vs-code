<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Progress Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container my-5">
    <div class="card shadow p-4">

        <!-- Breadcrumb -->
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item">Home</li>
            <li class="breadcrumb-item">Courses</li>
            <li class="breadcrumb-item active">Web Development</li>
        </ol>

        <!-- Heading with Badge -->
        <h2 class="mb-4">
            Web Development Course 
            <span class="badge bg-danger">New</span>
        </h2>

        <!-- HTML -->
        <p class="fw-bold mb-1">HTML – 100% complete</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-success progress-bar-striped" style="width: 100%">
                100%
            </div>
        </div>

        <!-- CSS -->
        <p class="fw-bold mb-1">CSS – 75% complete</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary progress-bar-striped progress-bar-animated" style="width: 75%">
                75%
            </div>
        </div>

        <!-- JavaScript -->
        <p class="fw-bold mb-1">JavaScript – 50% complete</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning text-dark" style="width: 50%">
                50%
            </div>
        </div>

        <!-- Bootstrap -->
        <p class="fw-bold mb-1">Bootstrap – 25% complete</p>
        <div class="progress mb-4">
            <div class="progress-bar bg-danger" style="width: 25%">
                25%
            </div>
        </div>

        <!-- Button Group -->
        <div class="btn-group mb-4">
            <button class="btn btn-success">Start</button>
            <button class="btn btn-warning">Pause</button>
            <button class="btn btn-danger">Reset</button>
        </div>

        <!-- Pagination -->
        <ul class="pagination justify-content-center">
            <li class="page-item active">
                <a class="page-link" href="#">1</a>
            </li>
            <li class="page-item">
                <a class="page-link" href="#">2</a>
            </li>
            <li class="page-item disabled">
                <a class="page-link" href="#">3</a>
            </li>
        </ul>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
